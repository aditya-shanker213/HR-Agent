<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HR AI Agent</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <div class="left-panel">

            <h1>HR AI Agent</h1>

            <p>

                Enterprise HR Intelligence Platform

            </p>

            <div class="roles">

                <span>Super Admin</span>

                <span>Admin</span>

                <span>HR</span>

                <span>Employee</span>

            </div>

        </div>

        <div class="right-panel">

            <div class="login-box">

                <h2>Login</h2>

                <p>

                    Secure Role-Based Access

                </p>

                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                    <button type="submit">

                        Login

                    </button>

                </form>

                <p id="message"></p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
